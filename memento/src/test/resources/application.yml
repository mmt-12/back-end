app:
  base-url: http://localhost:8080
  admin-email: test@test.com

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  mail:
    host: localhost
    port: 587

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL;DATABASE_TO_UPPER=false;
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 500MB

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  buckets:
    post: post
    voice: voice
    emoji: emoji
    profile-image: profile-image

